[project]
name = "vlaptop"
version = "1.2.0"
description = "Standalone screen system: see, touch, type, and click the live desktop. Pocket can host the same contract."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ItsNotAI Labs"}]
keywords = ["screen", "agent", "vlaptop", "touch", "phoneai", "pocket"]

[project.scripts]
vlaptop = "vlaptop.host:main"

[project.urls]
Homepage = "https://github.com/ItsNotAILABS/vlaptop"
Host = "https://github.com/ItsNotAILABS/pocket"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vlaptop*"]
