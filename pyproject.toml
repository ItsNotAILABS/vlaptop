[project]
name = "vlaptop"
version = "1.1.0"
description = "Screen kernel client: see, touch, type, click, embody the live PC."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ItsNotAI Labs"}]
keywords = ["screen", "agent", "vlaptop", "touch", "phoneai", "pocket"]

[project.urls]
Homepage = "https://github.com/ItsNotAILABS/vlaptop"
Host = "https://github.com/ItsNotAILABS/pocket"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vlaptop*"]
